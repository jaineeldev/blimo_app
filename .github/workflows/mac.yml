# Builds the Mac version on GitHub's free Macs, checks its signature, opens it, takes screenshots and tries moving it.
# Run it from the Actions tab (Mac build → Run workflow). When it finishes, the run page has two downloads:
#   Blimo-Mac          the dmg, zip, blockmaps and latest-mac.yml to attach to a release
#   Mac screenshots    what it looked like once open and moved around, plus placement.txt, its signature check and log
name: Mac build

on:
  workflow_dispatch:

jobs:
  mac:
    # Apple Silicon, macOS 15. (GitHub stops supporting its macOS 14 machines in November 2026.)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 for mac-placement-check.mjs, which needs Node's built-in WebSocket.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same build as on Windows; the helper step skips itself on a Mac.
      - name: Build
        run: npm run build

      - name: Find the app
        id: app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "dir=release/$VERSION" >> "$GITHUB_OUTPUT"
          echo "app=release/$VERSION/mac-universal/Blimo.app" >> "$GITHUB_OUTPUT"
          ls -la "release/$VERSION"

      # Ad-hoc signed (no Apple certificate), and one app for both Apple Silicon and Intel.
      - name: Check the signature
        run: |
          APP="${{ steps.app.outputs.app }}"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee signature.txt
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee -a signature.txt
          echo "architectures: $(lipo -archs "$APP/Contents/MacOS/Blimo")" | tee -a signature.txt

      # A first look before anyone tries it on a real Mac. Opened the way double-clicking it does (so the
      # menu bar app setup applies: no Dock icon), on its intro, as a new install would. Then it's tried
      # all over the screen, and with a real drag (cliclick plays the mouse).
      - name: Open it, take screenshots and try moving it
        continue-on-error: true
        run: |
          brew install cliclick
          open --stdout "$PWD/app.log" --stderr "$PWD/app.log" "${{ steps.app.outputs.app }}" --args --inspect=9229
          sleep 15
          screencapture -x shot-1.png
          sleep 8
          screencapture -x shot-2.png
          node .github/mac-placement-check.mjs
          pkill -f "Blimo.app" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Blimo-Mac
          path: |
            ${{ steps.app.outputs.dir }}/*.dmg
            ${{ steps.app.outputs.dir }}/*.zip
            ${{ steps.app.outputs.dir }}/*.blockmap
            ${{ steps.app.outputs.dir }}/latest-mac.yml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac screenshots
          path: |
            shot-*.png
            place-*.png
            placement.txt
            signature.txt
            app.log
